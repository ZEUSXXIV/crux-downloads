<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crux — the deck</title>
    <script>
      // Retitle the audience tab so the two tabs are distinguishable in the
      // browser tab strip and in Meet's "Share a tab" picker.
      if (new URLSearchParams(location.search).get("mode") === "audience") {
        document.title = "Crux — Audience";
      }
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; background: #0a0a0a; overflow: hidden; }
      hyperframes-slideshow { display: block; position: relative; width: 100vw; height: 100vh; }
      hyperframes-player { position: absolute; inset: 0; }
    </style>
    <script src="player.js"></script>
    <script src="slideshow.js"></script>
  </head>
  <body>
    <hyperframes-slideshow tabindex="0" sound>
      <hyperframes-player interactive src="composition/index.html"></hyperframes-player>
      <script type="application/hyperframes-slideshow+json">
{
  "slides": [
    { "sceneId": "s-title", "notes": "Crux tells you why every table and column in your SQL Server database exists, and what a change will break, before you make it. It reads your own history: migration scripts, the commits that wrote them, and the pull requests behind those commits, and cites a source for every answer. It works in its own app, inside SSMS, and inside AI tools like Claude Code." },
    { "sceneId": "s-moment", "fragments": [8.5, 10.6], "notes": "Start with a moment everyone in the room has lived. Someone asks: can we drop this column? (click) And the answers are always the same. Nobody knows who added it. The pull request is years old. The person who knew has moved on. So one of two things happens: nobody touches it, and the schema keeps growing, or someone does, and something breaks in production." },
    { "sceneId": "s-why", "notes": "Problem one. The reason behind every change does exist, but it is scattered across four places. The migration script says what changed, never why. Commit messages say 'update schema'. The real reasoning is in pull request discussions, buried years deep. And the rest is in people's heads, and people move on. Finding one answer means digging through all four, by hand." },
    { "sceneId": "s-break", "notes": "Problem two. Changes break things nobody can see. You drop a column; three stored procedures still use it, and they fail the next time they run. Someone hotfixed production by hand and the migrations never knew, so the next deployment collides. Or an ALTER on a big table locks it in the middle of the working day. None of this is visible in the script you're reviewing." },
    { "sceneId": "s-used", "notes": "Problem three. Nobody knows what's really used. Tables nothing reads, columns no query touches, indexes that cost every write and help no read. Because nobody can prove they're unused, nobody dares remove them, so clean-ups never happen and the schema only grows." },
    { "sceneId": "s-where", "notes": "Problem four. Even the knowledge that exists isn't where the work happens. DBAs live in SSMS. Developers live in their IDE and in pull requests. And now AI agents write migrations too, with no idea what the schema's history is or what depends on what. Every one of them has to stop and go digging." },
    { "sceneId": "s-crux", "notes": "Crux is your database's memory. It reads the migration scripts, the git history and the GitHub pull requests, and optionally the running database, read-only and metadata only. It replays every change into a history of every table and column. Then it answers, with sources, wherever you work: in its own app, in SSMS, and in AI tools through MCP. It runs on your machine." },
    { "sceneId": "s-arch", "notes": "How it works, at a high level. On the left, what Crux reads: the migration scripts, parsed with Microsoft's own T-SQL parser; the git history; the pull requests from GitHub; and, if you connect it, the running database, read-only: its catalog, index statistics, Query Store and migration history table. In the middle, the engine, on your own machine: it replays every script into a history of every table and column, attaches the commit and pull request behind each change as numbered sources, and builds the reports and checks from that. Its own data, chats and usage history, sit in one local file, with connections encrypted. A model is only used to write answers in plain English, and you choose it: free NVIDIA models, a local Ollama model, or Claude. Reports and checks need no model at all. On the right, the five ways in: the desktop app, SSMS, AI tools over MCP, where the agent's own model writes the answer, the command line, and CI for pull requests." },
    { "sceneId": "s-engine", "notes": "One level down, for a technical audience. Read: Crux finds the migration scripts and orders them as Flyway or your runner would, and parses each one with ScriptDom, Microsoft's own T-SQL parser, so it understands CREATE, ALTER, sp_rename and the rest, not just text. git blame finds the commit that wrote every statement; the GitHub API brings the pull request, its reviews and linked tickets. With a database connected, it reads the catalog, the migration history table, index statistics and Query Store; query text is parsed and dropped. Understand: every change is replayed in order into a schema history where each table and column keeps one identity through renames and drop-and-recreate. Each fact is tied to numbered sources: M for the migration, C for the commit, P for the pull request. Usage counts are kept across server restarts, so growth and 'never read' mean something. Answer: eighteen reports and the checks are plain code over that history, so they come out the same every time and need no model. The agent gives a model seventeen read-only lookup tools and checks that its answer cites real sources. Deliver: one local web server serves the same page to the browser, the desktop window and the SSMS panel; the MCP server hands the same tools to AI agents; the CLI runs the checks in CI. Everything Crux keeps is in one SQLite file in your user folder, with connection strings encrypted by Windows." },
    { "sceneId": "s-f-why", "notes": "Feature one: ask why, and get the receipts. This is a real answer on the open-source Bitwarden server. Asked why a column was added, Crux traced it to the migration, the commit and pull request 8663, and cites each one: M1, C1, P1. Click any and you see the source. And when the history doesn't record a reason, Crux says so instead of guessing. That's the lost 'why', fixed." },
    { "sceneId": "s-f-break", "notes": "Feature two: know before you change. This is a real check of a one-line script, ALTER TABLE Device DROP COLUMN PushToken, before anyone runs it. Crux names the three procedures that would fail and tells you to refresh the view that selects star. The same checks run on every pull request with /pr, and in CI with crux check. And /impact lists everything that depends on a table or column at any time." },
    { "sceneId": "s-f-prod", "notes": "Feature three: see what production really does. Connect a running database, read-only, catalog and statistics only, and Crux compares it with the migrations. This is real /drift output: a procedure someone changed by hand, and a hotfix script that ran in the database but was never committed. /deployed shows which scripts reached the database and which queries got slower afterwards. /usage shows sizes and growth, tables, columns and indexes nothing uses, and the quietest hour to make a change." },
    { "sceneId": "s-f-ssms", "notes": "Feature four: right inside SSMS. Right-click any table, column, view or procedure in Object Explorer: Crux, why does this exist, what depends on it, how is it used. Right-click in a query window: check this script before you run it. The answer opens in a docked Crux panel, the real panel on the right, which follows SSMS's theme. DBAs never leave their tool." },
    { "sceneId": "s-f-ai", "notes": "Feature five: Crux gives AI agents a memory. This is a real run in Claude Code. Asked whether it's safe to drop PushToken, the agent called Crux's impact, usage and timeline tools by itself, and answered: not safe yet, with the procedures that use it, an index that has to go first, and a hand-made index Crux flagged as drift, each with links to the sources. It works in Claude Code, Claude Desktop, VS Code and Cursor. Crux calls no model of its own here; the agent's model writes the answer." },
    { "sceneId": "s-f-reports", "notes": "Feature six: ready-made reports. Type a slash and pick one. They're built from the history by code, not by a model, so they come out the same every time. Explain a table, a column's story, what changed this month, who changed what, what was dropped and why, renames, changes with no recorded reason, stale tables, relationship diagrams, comparisons between releases, and describe, which drafts missing column descriptions as a migration for review." },
    { "sceneId": "s-trust", "notes": "Everything about Crux is built to be trusted with a production database. It only reads. Every claim cites its source. It runs on your machine. Query text and query plans never leave Crux, and connection strings are encrypted. You choose the model: free NVIDIA models, a local Ollama model, Claude, or your AI tool's own. And when the history doesn't say why, Crux tells you so." },
    { "sceneId": "s-ba", "notes": "Put together: the same five questions, without Crux and with it. Each 'without' is someone stopping their work to dig, or guessing. Each 'with' is one question, answered with sources, in seconds, in the tool they already have open." },
    { "sceneId": "s-redgate", "notes": "A word for Redgate. Flyway knows what changed and when, and applies it reliably. Crux adds the why, and what a change will break. It reads Flyway projects as they are: flyway.toml, V-scripts and the schema history table. It sits in SSMS alongside SQL Prompt. And it checks pull requests the way Flyway users ship them. Together, a team gets the full story of its database." },
    { "sceneId": "s-get", "notes": "Try it on your own database. It's a free download for Windows. Install it, point it at your repository or paste a GitHub link, and ask why. Add it to SSMS from Setup, and to your AI tools from Settings. Crux 0.2.0 is out now." }
  ]
}
      </script>
    </hyperframes-slideshow>
    <!-- Present CTA lives in the component's nav cluster (data-hf-present, plus
         the P key) — no page-level button, or we'd render two Present CTAs. -->
    <script>
      // Sound effects play HERE, in the parent document. The composition runs in the
      // player's iframe, which is autoplay-blocked without its own user gesture; the
      // slideshow posts { type: "hf-sfx", name } to the parent on nav, and we play the
      // matching clip from the deck's sfx/ folder (served under /composition/sfx/).
      // Runs in both presenter and audience windows. Missing clips fail silently.
      (function () {
        var clips = {
          advance: new Audio("composition/sfx/advance.mp3"),
          fragment: new Audio("composition/sfx/fragment.mp3"),
          "branch-enter": new Audio("composition/sfx/branch-enter.mp3"),
          back: new Audio("composition/sfx/back.mp3"),
        };
        clips.advance.volume = 0.45;
        clips.fragment.volume = 0.4;
        clips["branch-enter"].volume = 0.4;
        clips.back.volume = 0.4;
        for (var k in clips) clips[k].preload = "auto";

        // Mute state is owned by <hyperframes-slideshow sound>; mirror it.
        var muted = false;
        function setClipsMuted(nextMuted) {
          Object.keys(clips).forEach(function (name) {
            clips[name].muted = nextMuted;
          });
        }
        var ss = document.querySelector("hyperframes-slideshow");
        if (ss) {
          ss.addEventListener("hf-sound", function (e) {
            muted = e.detail && e.detail.muted === true;
            setClipsMuted(muted);
          });
        }

        // Autoplay needs a user gesture — prime each clip (play muted, reset) on the
        // first interaction so later plays are instant and allowed.
        var unlocked = false;
        function unlock() {
          if (unlocked) return;
          unlocked = true;
          Object.keys(clips).forEach(function (name) {
            var el = clips[name];
            var v = el.volume;
            el.volume = 0;
            el.play()
              .then(function () {
                el.pause();
                el.currentTime = 0;
                el.volume = v;
              })
              .catch(function () {
                el.volume = v;
              });
          });
        }
        window.addEventListener("keydown", unlock, true);
        window.addEventListener("pointerdown", unlock, true);
        window.addEventListener("click", unlock, true);

        window.addEventListener("message", function (e) {
          // Only accept cues from this origin (the composition iframe is same-origin).
          if (e.origin !== location.origin) return;
          var d = e.data;
          if (!d || d.type !== "hf-sfx" || muted) return;
          // Own-property guard: a malicious name like "__proto__" must not resolve to
          // a prototype object (which would be truthy and then get mutated below).
          if (!Object.prototype.hasOwnProperty.call(clips, d.name)) return;
          var el = clips[d.name];
          if (!el || !unlocked) return;
          try {
            el.currentTime = 0;
            el.play().catch(function () {});
          } catch (err) {
            /* ignore */
          }
        });
      })();
    </script>
  </body>
</html>
