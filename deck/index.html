    <style>

    <hyperframes-slideshow tabindex="0" sound>
      <hyperframes-player interactive src="composition/index.html"></hyperframes-player>
      <script type="application/hyperframes-slideshow+json">
{
  "slides": [
    {"sceneId": "s-title", "notes": "Crux. One sentence: it tells you why every table and column in your database exists, from your own history, with sources. It is a desktop app, lives inside SSMS and AI tools, reads PostgreSQL as well as SQL Server, and can run scripts for real in a sandbox. Then: the problem, what Crux does and where, each feature in turn, proof, what it costs to run, and three slides on how it is built."},
    {"sceneId": "s-problem", "fragments": [8.5, 10.5], "notes": "Start with the first three questions. Ask the room: if you had to find out today why a column exists and which PR added it, how long would it take? (click) Then the operational ones: does production still match the migrations, which scripts reached which database, and will this migration actually run, and what does it break. These come up every week in teams that run SQL Server or PostgreSQL with Flyway, DbUp or their own runner."},
    {"sceneId": "s-scale", "notes": "Make it concrete with a real, public codebase: bitwarden/server. 560 migration scripts. 71 tables and 772 columns described by them, and not one has a description. That is normal, not a criticism. The reasons exist, but they are spread across scripts, git history, pull request discussions and the heads of people who may have left."},
    {"sceneId": "s-solution", "notes": "Crux reads the repository's migration history: the scripts, the git commits that wrote them, and the GitHub pull requests behind those commits. Ask a question and it follows the chain from migration to commit to pull request, and answers with each source cited. If no reason was recorded, it says so. It only reads your databases; the one place it ever writes is a sandbox database of its own, which it builds from the migrations. It runs on your machine."},
    {"sceneId": "s-surfaces", "notes": "Crux meets people where they already work. A Windows desktop app with chat, reports and a side panel, which installs per user and now updates itself from inside. Inside SQL Server Management Studio 22, where DBAs live. As an MCP server, so Claude Code, Claude Desktop, VS Code and Cursor can ask it before they change a schema. And on the command line and in CI, where crux check reviews a pull request's migrations. All of it reads SQL Server and PostgreSQL, and the common migration layouts."},
    {"sceneId": "s-capabilities", "notes": "Chat, plus 19 ready-made reports where code, not the model, gathers the facts, so they come out the same every time. Impact before a change, drift between a live database and its migrations, the pull request check, usage from index statistics and Query Store with the quietest hours, and describe, which drafts missing column descriptions as a migration for review. Any branch can be read straight from git without checking it out."},
    {"sceneId": "s-evidence", "notes": "This is real output on bitwarden. Left: impact for Device.PushToken: which procedures and views use it, directly and through others, each line citing the migration and commit that last defined it. Right: drift against a test copy where hand changes were made, each shown like a pull request diff. The model did not invent any of this; code built it from the history."},
    {"sceneId": "s-ssms", "notes": "Inside SSMS 22. A quick look card on any table or column, from Object Explorer or Ctrl+K Ctrl+Q in a query: type, when it was made and changed with its pull request, size, and what uses it, in under a second with no model. History on hover over names in a query. Crux on the status bar, following the selection. And the one people like most: when a query fails because a column is not there, the status bar says Crux: why?, and the card explains it from the history, renamed to what and in which script, with Copy fixed query and Ask Crux to fix it. Check this script runs Crux's checks, and now the sandbox, before anything runs."},
    {"sceneId": "s-sandbox", "notes": "New in 0.5. Crux used to check a script by reading it. Now it can run it. It builds a database of its own from the migrations, on LocalDB or a development server, runs each script it checks there, and rolls it back. Bitwarden's 560 migrations build in about 12 seconds. Renaming one column, Organization.UseSso: reading the script finds 6 objects that use it; running it finds 31, mostly procedures reading it through a view, which would have failed at run time. And it is fenced: only its own marked database, scripts run as a database user with no login that SQL Server keeps off the server and out of other databases, anything reaching outside is refused up front, and every run is rolled back."},
    {"sceneId": "s-checked", "notes": "New in 0.5.1. When the chat's model writes SQL, a query, a fix or a migration, Crux checks it before you see it. It looks for names your migrations don't have, runs it in the sandbox to catch errors SQL Server would give, and looks for code the change would break. Any problem goes back to the model with the real columns, for up to two rounds. What you see is the version that works, marked Corrected before it was shown. In the example the model guessed a column called Token; Device's column is PushToken."},
    {"sceneId": "s-planmode", "notes": "New in 0.5.1. An Ask and Plan switch by the chat box. In Plan mode you describe a change and get a plan first: the steps, what each touches, the risk, and how to back out. A rename is done in steps, adding the new column, moving the code that reads the old one, then dropping it. Generate migrations writes one migration per step; they are checked and run together, in order, in the sandbox. Save all writes them into the repository with its own naming. The file names here are shortened for the slide."},
    {"sceneId": "s-sizes", "notes": "New in 0.5.1. The sandbox is built from migrations, so its tables are empty, and SQL Server plans an empty table very differently from a 40-million-row one. With a database connected, Crux takes the real tables' row counts, only the counts, never the data, and gives them to the sandbox's tables inside the run that is rolled back. Then it asks SQL Server for its estimated plan, freshly compiled. It shows the plan only when it matters: a scan of 100,000 rows or more, 10,000 or more rows read, or a new index being used. The numbers are an example."},
    {"sceneId": "s-proof", "notes": "Crux was not built against one friendly sample. bitwarden and four other public repositories that each keep migrations differently, and on the PostgreSQL side Documenso, Mattermost and Conductor, built from their migrations on PostgreSQL 17.7, where every table, column, type, index and key Crux works out matches the real database. On the drifted test database, drift finds exactly the twelve planted hand changes. The sandbox builds all 560 Bitwarden migrations from scratch with no failures. 587 automated tests, 20 of them against a real SQL Server, plus eval suites that measure pass rates rather than single runs."},
    {"sceneId": "s-run", "notes": "Running it is cheap. Prices are Anthropic's list prices per million tokens. Assumption: a chat answer makes several lookups, about 5 to 20 thousand input tokens and about a thousand output tokens; 20 questions per developer per working day. On Opus 5.5 that is about 17 to 42 dollars per developer per month; Sonnet 5.5 halves it; Haiku 5.5 is around a dollar. Checked fixes add a round or two only when a script is wrong. Prompt caching makes repeated context much cheaper. The reports, the CI check and the sandbox need no model at all, and in development a local model or NVIDIA's free tier costs nothing."},
    {"sceneId": "s-arch", "notes": "Three slides on how it is built. First the layers, left to right. Crux reads migration scripts and git locally, pull requests from GitHub's API, and, if you connect one, a live database, read-only. The engine parses the scripts with Microsoft's T-SQL parser or PostgreSQL's own, replays them into a history of every object over time, and builds evidence and checks on top: the reports, impact, drift, usage, the pull request check, and runs in the sandbox, Crux's own database and the only place it ever writes. The agent runs the model in a tool loop over that evidence, with checked fixes and Plan mode. The model is Claude, NVIDIA's hosted open models, or a local model through Ollama. Answers appear in the desktop app, SSMS, AI tools through MCP, and the command line and CI."},
    {"sceneId": "s-flow", "notes": "Second, what happens to one question. You ask, anywhere. The agent decides which lookups it needs: the timeline, impact, usage, a search. Code, not the model, gathers the facts, and gives each one an id: M for a migration, C for a commit, P for a pull request. The model writes the answer and may cite only those ids, or say that no reason was recorded. If the answer has SQL in it, Crux checks it, and a problem goes back to the model with the real columns, up to two rounds. Then you get the answer with every claim linked. Reports and the CI check stop at step three: no model is involved, so they give the same result every time."},
    {"sceneId": "s-parts", "notes": "Third, for a technical audience: the main parts and where they live in the code. Parsing with ScriptDom and PostgreSQL's parser, SchemaHistory replay, GitRepo and GitHubClient, LiveDatabase, Drift and ProductionSignals for live databases, the Sandbox files for building, guarding, running and planning, the agent with its checks and Plan mode, the Recipes and ChangeCheck, the desktop app with its updater, the SSMS extension and the MCP server, and AppStore with Secrets. About 27,500 lines of C#, 8,800 lines of tests and a 6,600-line web page."}
  ]
}
</script>

    <!-- Present CTA lives in the component's nav cluster (data-hf-present, plus
         the P key) — no page-level button, or we'd render two Present CTAs. -->
    <script>
      // Sound effects play HERE, in the parent document. The composition runs in the
      // player's iframe, which is autoplay-blocked without its own user gesture; the
      // slideshow posts { type: "hf-sfx", name } to the parent on nav, and we play the
      // matching clip from the deck's sfx/ folder (served under /composition/sfx/).
      // Runs in both presenter and audience windows. Missing clips fail silently.
      (function () {
        var clips = {
          advance: new Audio("composition/sfx/advance.mp3"),
          fragment: new Audio("composition/sfx/fragment.mp3"),
          "branch-enter": new Audio("composition/sfx/branch-enter.mp3"),
          back: new Audio("composition/sfx/back.mp3"),
        };
        clips.advance.volume = 0.45;
        clips.fragment.volume = 0.4;
        clips["branch-enter"].volume = 0.4;
        clips.back.volume = 0.4;
        for (var k in clips) clips[k].preload = "auto";

        // Mute state is owned by <hyperframes-slideshow sound>; mirror it.
        var muted = false;
        function setClipsMuted(nextMuted) {
          Object.keys(clips).forEach(function (name) {
            clips[name].muted = nextMuted;
          });
        }
        var ss = document.querySelector("hyperframes-slideshow");
        if (ss) {
          ss.addEventListener("hf-sound", function (e) {
            muted = e.detail && e.detail.muted === true;
            setClipsMuted(muted);
          });
        }

        // Autoplay needs a user gesture — prime each clip (play muted, reset) on the
        // first interaction so later plays are instant and allowed.
        var unlocked = false;
        function unlock() {
          if (unlocked) return;
          unlocked = true;
          Object.keys(clips).forEach(function (name) {
            var el = clips[name];
            var v = el.volume;
            el.volume = 0;
            el.play()
              .then(function () {
                el.pause();
                el.currentTime = 0;
                el.volume = v;
              })
              .catch(function () {
                el.volume = v;
              });
          });
        }
        window.addEventListener("keydown", unlock, true);
        window.addEventListener("pointerdown", unlock, true);
        window.addEventListener("click", unlock, true);

        window.addEventListener("message", function (e) {
          // Only accept cues from this origin (the composition iframe is same-origin).
          if (e.origin !== location.origin) return;
          var d = e.data;
          if (!d || d.type !== "hf-sfx" || muted) return;
          // Own-property guard: a malicious name like "__proto__" must not resolve to
          // a prototype object (which would be truthy and then get mutated below).
          if (!Object.prototype.hasOwnProperty.call(clips, d.name)) return;
          var el = clips[d.name];
          if (!el || !unlocked) return;
          try {
            el.currentTime = 0;
            el.play().catch(function () {});
          } catch (err) {
            /* ignore */
          }
        });
      })();
    </script>
  </body>
</html>
